<style>
:root{
  color-scheme: dark;
  --bg:      #0c0c0c;
  --fg:      #cccccc;
  --white:   #f2f2f2;
  --green:   #16c60c;
  --cyan:    #61d6d6;
  --yellow:  #f9f1a5;
  --red:     #e74856;
  --blue:    #3b78ff;
  --muted:   #767676;
  --border:  #2b2b2b;
  --border-hi:#4d4d4d;
  --chrome:  #202020;
  --chrome-2:#2d2d2d;
  --accent:  #60cdff;
  --ui: 'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Cascadia Mono','Cascadia Code',Consolas,'Lucida Console','SF Mono',Menlo,'DejaVu Sans Mono',monospace;
  font-size:15px;
  line-height:1.4;
  overflow:hidden;
}
::selection{background:var(--fg);color:var(--bg);}

/* ================= window chrome ================= */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;}
.titlebar{
  height:34px;flex-shrink:0;background:var(--chrome);
  display:flex;align-items:stretch;justify-content:space-between;
  font-family:var(--ui);font-size:12px;color:#e6e6e6;user-select:none;
}
.tb-left{display:flex;align-items:center;gap:9px;padding-left:11px;min-width:0;}
.tb-left svg{flex-shrink:0;}
.tb-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tb-controls{display:flex;flex-shrink:0;}
.tb-btn{width:46px;display:flex;align-items:center;justify-content:center;color:#e6e6e6;}
.tb-btn:hover{background:#3a3a3a;}
.tb-btn.close:hover{background:#c42b1c;color:#fff;}

.tabbar{
  min-height:34px;flex-shrink:0;display:flex;align-items:stretch;
  background:#181818;border-bottom:1px solid var(--border);
  overflow-x:auto;font-family:var(--ui);
}
.tabbar::-webkit-scrollbar{height:0;}
.tab{
  padding:0 15px;display:flex;align-items:center;font-size:12.5px;color:#a6a6a6;
  border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;
  border-top:2px solid transparent;
}
.tab:hover{color:#fff;background:#222;}
.tab.active{color:#fff;background:var(--bg);border-top-color:var(--accent);}
.tab .tag{color:var(--muted);margin-right:7px;font-family:'Cascadia Mono',Consolas,monospace;font-size:11.5px;}
.tab.active .tag{color:var(--accent);}
#resumeTab .tag{color:var(--yellow);}

.termwrap{flex:1;min-height:0;position:relative;display:flex;min-width:0;}
#terminal{
  flex:1;min-width:0;overflow-y:scroll;overflow-x:hidden;padding:8px 14px 60px;background:var(--bg);
  -webkit-overflow-scrolling:touch;
}
#terminal::-webkit-scrollbar{width:17px;}
#terminal::-webkit-scrollbar-track{background:#171717;}
#terminal::-webkit-scrollbar-thumb{background:#4d4d4d;}
#terminal::-webkit-scrollbar-thumb:hover{background:#7a7a7a;}
@supports not selector(::-webkit-scrollbar){ #terminal{scrollbar-color:#4d4d4d #171717;} }

/* ================= console text ================= */
.line{white-space:pre-wrap;word-break:break-word;}
.prompt-line{display:flex;flex-wrap:wrap;margin-top:8px;}
.ps{color:var(--fg);white-space:nowrap;}
.cmd-echo{color:var(--fg);}
.out{margin:6px 0 4px 0;max-width:100%;overflow-wrap:break-word;word-break:break-word;}
.dim{color:var(--muted);}
.amber{color:var(--yellow);}
.cyan{color:var(--cyan);}
.green{color:var(--green);}
.red{color:var(--red);}
.bold{font-weight:700;}
.bold:not(.green):not(.amber):not(.cyan):not(.red):not(.dim){color:var(--white);}
.link{color:var(--cyan);text-decoration:underline;text-underline-offset:3px;cursor:pointer;}
.link:hover{color:var(--white);}
.desc-text{color:#b0b0b0;}

table.ftable{border-collapse:collapse;margin:4px 0;max-width:100%;width:100%;table-layout:auto;}
table.ftable td{padding:1px 14px 1px 0;vertical-align:top;overflow-wrap:break-word;word-break:break-word;}
table.ftable tr.ftable-head td{
  font-size:12px;color:var(--muted);
  border-bottom:1px solid var(--border-hi);padding-bottom:5px;
}
table.kv-table td:first-child{padding-right:6px;}
table.kv-table td:nth-child(2){padding-right:10px;}
table.dir-table td.num{text-align:right;padding-right:16px;}
table.dir-table td{white-space:nowrap;}

.neofetch-row{display:flex;gap:26px;flex-wrap:wrap;max-width:100%;}
.neofetch-row table.ftable{flex:1;min-width:0;}
.ascii{color:var(--blue);font-size:12px;line-height:1.15;}
.bar{white-space:nowrap;}

.clickable-cmd{
  display:inline-block;border:1px solid var(--border-hi);
  padding:0 8px;margin:3px 6px 3px 0;color:var(--yellow);cursor:pointer;
}
.clickable-cmd:hover{background:var(--fg);color:var(--bg);border-color:var(--fg);}

.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:8px 0 4px;max-width:100%;}
.pcard{border:1px solid var(--border-hi);padding:8px 12px;min-width:0;overflow-wrap:break-word;word-break:break-word;}
.pcard:hover{border-color:var(--muted);}
.pcard .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700;color:var(--white);min-width:0;}
.pcard .ph .link{flex-shrink:0;white-space:nowrap;font-weight:400;}
.pcard .ph .dim{flex-shrink:0;white-space:nowrap;font-weight:400;}
.pcard .ph span:first-child{min-width:0;overflow-wrap:break-word;word-break:break-word;}
.pcard .stack{color:var(--cyan);font-size:12.5px;margin-top:4px;overflow-wrap:break-word;}
.pcard .desc{color:#b0b0b0;font-size:13px;margin-top:6px;overflow-wrap:break-word;}

form#cmdform{display:flex;align-items:center;margin-top:8px;}
#cmdinput{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--fg);
  font-family:inherit;font-size:15px;caret-color:var(--fg);caret-shape:underscore;
}

/* ================= taskbar ================= */
.taskbar{
  height:40px;flex-shrink:0;background:#1c1c1c;border-top:1px solid #2f2f2f;
  display:flex;align-items:center;padding:0 12px;
  font-family:var(--ui);font-size:11.5px;color:#d6d6d6;user-select:none;
}
.tk-side{flex:1;display:flex;}
.tk-side.right{justify-content:flex-end;}
.tk-center{display:flex;align-items:center;gap:4px;}
.tk-btn{width:38px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:5px;}
.tk-btn:hover{background:#2c2c2c;}
.tk-btn.open{background:#2b2b2b;position:relative;}
.tk-btn.open::after{content:"";position:absolute;bottom:2px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--accent);}
.tray{text-align:right;line-height:1.25;padding:2px 6px;border-radius:5px;}
.tray:hover{background:#2c2c2c;}

/* ================= small screens ================= */
@media (max-width:640px){
  body{font-size:13.5px;overflow-x:hidden;}
  #terminal{padding:8px 10px 60px;}
  #terminal::-webkit-scrollbar{width:10px;}
  .tb-btn{width:38px;}
  .card-grid{grid-template-columns:1fr;}
  .neofetch-row{flex-direction:column;gap:14px;}
  #cmdinput{font-size:16px;}
  .tk-side:first-child{display:none;}
  .tk-center{margin-right:auto;}

  .tabbar{overflow-x:visible;flex-wrap:wrap;height:auto;border-bottom:1px solid var(--border-hi);}
  .tab{flex:0 0 auto;padding:7px 10px;font-size:11px;border-bottom:1px solid var(--border);}
  .tab .tag{margin-right:4px;}

  /* rigid tables squeeze columns to one word per line on narrow screens;
     turn each row into a wrapping flex line instead */
  table.ftable, table.ftable tbody{display:block;width:100%;}
  table.ftable tr{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;row-gap:2px;width:100%;padding:3px 0;}
  table.ftable td{display:block;padding:0;white-space:normal;overflow-wrap:break-word;word-break:normal;flex:0 1 auto;min-width:0;}
  table.dir-table td{white-space:normal;}
  table.dir-table td.num{text-align:left;padding-right:0;}
  table.kv-table td:first-child,
  table.ftable tr.ftable-head td,
  table.ftable td.cyan:first-child,
  table.ftable td.dim:first-child,
  table.ftable td.amber:first-child{white-space:nowrap;}
  table.ftable tr:not(.ftable-head){border-bottom:1px solid var(--border);}
  table.ftable tr:last-child{border-bottom:none;}
  table.ftable tr.ftable-head{border-bottom:1px solid var(--border-hi);margin-bottom:2px;}
  .pcard .ph{flex-wrap:wrap;}
}
</style>
</head>

let skipBoot = false, booted = false;
function finishBoot(){ if(booted) return; booted = true; initTerminal(); }

function typeBoot(){
  const el = document.getElementById("bootText");
  let li = 0;
  function nextLine(){
    if(skipBoot){ el.textContent = bootLines.join("\n") + "\n"; finishBoot(); return; }
    if(li >= bootLines.length){ finishBoot(); return; }
    const line = bootLines[li];
    const isCmd = line.startsWith(PROMPT);
    if(li < 3 || line === ""){
      el.textContent += line + "\n"; li++;
      setTimeout(nextLine, li <= 3 ? 90 : 25);
      return;
    }
    let ci = 0;
    const speed = isCmd ? 55 : 5;
    (function typeChar(){
      if(skipBoot){ el.textContent += line.slice(ci) + "\n"; li++; nextLine(); return; }
      if(ci < line.length){
        el.textContent += line[ci++];
        setTimeout(typeChar, speed + Math.random() * speed * 0.6);
      } else {
        el.textContent += "\n"; li++;
        setTimeout(nextLine, isCmd ? 380 : 45);
      }
    })();
  }
  nextLine();
}

window.addEventListener("DOMContentLoaded", () => {
  const skip = () => { skipBoot = true; };
  document.addEventListener("keydown", skip);
  document.addEventListener("pointerdown", skip);
  typeBoot();
  // stop listening once the shell is ready
  const poll = setInterval(() => {
    if(booted){
      document.removeEventListener("keydown", skip);
      document.removeEventListener("pointerdown", skip);
      clearInterval(poll);
    }
  }, 200);
});

/* map Linux-style and Windows-style input onto one canonical command */
function normalize(raw){
  let s = raw.trim().replace(/\\/g,"/").replace(/\s+/g," ").toLowerCase();
  s = s.replace(/\/(?= |$)/g,"");
  s = s.replace(/^ls( -la| -l| \.)?(?= |$)/,"dir");
  s = s.replace(/^cat /,"type ");
  s = s.replace(/^cd (projects|certifications|certs)$/,"dir $1");
  s = s.replace(/^dir certs$/,"dir certifications");
  s = s.replace(/contact\.sh$/,"contact.bat");
  s = s.replace(/^start resume(\.pdf)?$/,"start resume.pdf");
  if(/^(sudo )?hire( rishita)?(\.exe)?$/.test(s) || s.startsWith("runas")) s = "hire rishita";
  return s;
}

function runCommand(raw){
  const cmdText = raw.trim();
  if(!cmdText) return;
  promptEcho(cmdText);

  let s = normalize(cmdText);

  if(s === "cls" || s === "clear" || s === "reset"){
    term().innerHTML = "";
    return;
  }

  if(s === "dir projects" || s.startsWith("dir projects ")){
    const cats = ["all","ai","security","data","iot","web"];
    const f = s.split(" ")[2] || "all";
    appendHTML(renderProjects(cats.includes(f) ? f : "all"));
    return;
  }

  if(ALIASES[s]) s = ALIASES[s];

  if(commands[s]){
    appendHTML(commands[s]());
    return;
  }

  if(s === "cd"){
    appendHTML(`<div class="out">C:\\Users\\Rishita</div>`);
    return;
  }

  if(s.startsWith("echo")){
    appendHTML(`<div class="out">${esc(cmdText.slice(4).replace(/^ /,"")) || "ECHO is on."}</div>`);
    return;
  }

  if(s === "type"){
    appendHTML(`<div class="out">The syntax of the command is incorrect.</div>`);
    return;
  }

  if(s.startsWith("type ")){
    appendHTML(`<div class="out">The system cannot find the file specified.<br><span class="dim">try</span> <span class="clickable-cmd" data-cmd="dir">dir</span></div>`);
    return;
  }

  const name = cmdText.split(/\s+/)[0];
  appendHTML(`<div class="out">'${esc(name)}' is not recognized as an internal or external command,<br>operable program or batch file.<br><span class="dim">try</span> <span class="clickable-cmd" data-cmd="help">help</span></div>`);
}

  cmdWrapEl.remove();

/* clickable command + link delegation */
document.addEventListener("click", (e) => {
  const cc = e.target.closest(".clickable-cmd");
  if(cc){
    const ci = document.getElementById("cmdinput");
    if(ci) ci.value = "";
    runCommand(cc.dataset.cmd);
    moveInputToBottom();
    return;
  }
  const link = e.target.closest("[data-open]");
  if(link){
    window.open(link.dataset.open, "_blank", "noopener");
    const ci = document.getElementById("cmdinput");
    if(ci) ci.focus();
    return;
  }
  const tab = e.target.closest(".tab");
  if(tab && tab.id === "resumeTab"){
    window.open(D.resume, "_blank", "noopener");
    return;
  }
  if(tab){
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    runCommand(tab.dataset.cmd);
    moveInputToBottom();
  }
});

/* input form */
function initTerminal(){
  appendHTML(renderSysinfo());
  appendHTML(`<div class="out dim">Type <span class="clickable-cmd" data-cmd="help">help</span>to get started, or click a tab above.</div>`);

  const wrap = document.createElement("form");
  wrap.id = "cmdform";
  wrap.innerHTML = `
    <span class="ps">${esc(PROMPT)}</span>
    <input id="cmdinput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Command input" />
  `;
  term().appendChild(wrap);
  cmdWrapEl = wrap;

  const input = wrap.querySelector("#cmdinput");
  input.focus();
  term().addEventListener("click", (e) => {
    if(e.target.closest("a, .link, [data-open], .clickable-cmd, .tab")) return;
    if(window.getSelection && String(window.getSelection())) return;
    input.focus();
  });

  let history = [];
  let hIdx = -1;

  wrap.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = input.value;
    if(val.trim()){
      history.push(val);
      hIdx = history.length;
    }
    runCommand(val);
    input.value = "";
    moveInputToBottom();
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "ArrowUp"){
      e.preventDefault();
      if(hIdx > 0){ hIdx--; input.value = history[hIdx]; }
    } else if(e.key === "ArrowDown"){
      e.preventDefault();
      if(hIdx < history.length - 1){ hIdx++; input.value = history[hIdx]; }
      else { hIdx = history.length; input.value = ""; }
    } else if(e.key === "Tab"){
      e.preventDefault();
      const partial = input.value.toLowerCase();
      if(!partial) return;
      const all = Object.keys(commands).filter(c => c !== "home");
      const match = all.find(c => c.startsWith(partial));
      if(match) input.value = match;
    }
  });
}

/* taskbar clock */
function tickClock(){
  const c = document.getElementById("clock"), dt = document.getElementById("date");
  if(!c || !dt) return;
  const d = new Date();
  c.textContent = fmtTime(d);
  dt.textContent = fmtDate(d);
}
setInterval(tickClock, 1000);
tickClock();
</script>
