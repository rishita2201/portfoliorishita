function typeBoot(cb){
  const el = document.getElementById("bootText");
  let li = 0;
  function nextLine(){
    if(li >= bootLines.length){ cb(); return; }
    const line = bootLines[li];
    let ci = 0;
    const speed = line.startsWith("[") ? 4 : 10;
    function typeChar(){
      el.textContent += line[ci] || "";
      ci++;
      if(ci <= line.length){
        setTimeout(typeChar, speed + Math.random()*8);
      } else {
        el.textContent += "\n";
        li++;
        setTimeout(nextLine, line === "" ? 30 : 55);
      }
    }
    typeChar();
  }
  nextLine();
}

window.addEventListener("DOMContentLoaded", () => {
  typeBoot(() => {
    setTimeout(() => {
      document.getElementById("boot").classList.add("hide");
      document.getElementById("app").style.display = "flex";
      initTerminal();
    }, 350);
  });
});

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function appendHTML(html){
  const div = document.createElement("div");
  div.innerHTML = html;
  term().appendChild(div);

}

function runCommand(raw){
  const cmdText = raw.trim();
  if(!cmdText) return;
  promptEcho(cmdText);

  if(cmdText === "clear"){
    term().innerHTML = "";
    return;
  }

  const lower = cmdText.toLowerCase();

  if(lower.startsWith("ls projects/")){
    const parts = lower.split(" ");
    const filter = parts.length > 2 ? parts[2] : "all";
    appendHTML(renderProjects(filter));
    return;
  }

  if(commands[lower]){
    appendHTML(commands[lower]());
    return;
  }

  // fuzzy aliases
  const aliases = {
    "ls -la": "ls", "ls -l": "ls", "ls .": "ls",
    "cat about": "whoami", "about": "whoami", "who": "whoami",
    "projects": "ls projects/", "cd projects": "ls projects/", "cd projects/": "ls projects/",
    "experience": "cat experience.log", "research": "cat research.md",
    "skills": "cat skills.yaml", "certs": "ls certifications/", "certifications": "ls certifications/",
    "achievements": "cat achievements.txt", "leadership": "cat leadership.txt",
    "contact": "cat contact.sh", "resume": "cat contact.sh",
    "man": "help", "h": "help", "?": "help",
    "hire": "sudo hire rishita", "hire rishita": "sudo hire rishita",
    "cls": "clear", "reset": "clear", "neofetch --off": "neofetch"
  };
  if(aliases[lower]){
    appendHTML(commands[aliases[lower]]());
    return;
  }

  appendHTML(`<div class="out red">bash: ${esc(cmdText)}: command not found<br><span class="dim">try</span> <span class="clickable-cmd" data-cmd="help">help</span></div>`);
}

let cmdWrapEl = null;
function moveInputToBottom(){
  if(!cmdWrapEl) return;
  cmdWrapEl.remove();
  term().appendChild(cmdWrapEl);
  const inp = cmdWrapEl.querySelector("#cmdinput");
  if(inp) inp.focus();
  term().scrollTop = term().scrollHeight;
}

/* clickable command + link delegation */
document.addEventListener("click", (e) => {
  const cc = e.target.closest(".clickable-cmd");
  if(cc){
    const c = cc.dataset.cmd;
    const ci = document.getElementById("cmdinput");
    if(ci) ci.value = "";
    runCommand(c);
    moveInputToBottom();
    return;
  }
  const link = e.target.closest("[data-open]");
  if(link){
    window.open(link.dataset.open, "_blank", "noopener");
    const ci = document.getElementById("cmdinput");
    if(ci) ci.focus();
    return;
  }
  const tab = e.target.closest(".tab");
  if(tab && tab.id === "resumeTab"){
    window.open(D.resume, "_blank", "noopener");
    return;
  }
  if(tab){
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    runCommand(tab.dataset.cmd);
    moveInputToBottom();
  }
});

/* input form */
function initTerminal(){
  appendHTML(`<div class="out dim">Welcome to rishita-os 26.09 LTS. Type <span class="clickable-cmd" data-cmd="help">help</span>to get started.</div>`);
  appendHTML(renderNeofetch());

  const wrap = document.createElement("form");
  wrap.id = "cmdform";
  wrap.innerHTML = `
    <span class="ps">rishita@vit-chennai<span class="sym">:</span><span class="path">~</span><span class="sym">$</span></span>
    <input id="cmdinput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
  `;
  term().appendChild(wrap);
  cmdWrapEl = wrap;

  const input = wrap.querySelector("#cmdinput");
  input.focus();
  document.getElementById("terminal").addEventListener("click", (e) => {
    if(e.target.closest("a, .link, [data-open], .clickable-cmd, .tab")) return;
    input.focus();
  });

  let history = [];
  let hIdx = -1;

  wrap.addEventListener("submit", (e) => {
    e.preventDefault();
    const val = input.value;
    if(val.trim()){
      history.push(val);
      hIdx = history.length;
    }
    runCommand(val);
    input.value = "";
    moveInputToBottom();
  });

  input.addEventListener("keydown", (e) => {
    if(e.key === "ArrowUp"){
      e.preventDefault();
      if(hIdx > 0){ hIdx--; input.value = history[hIdx]; }
    } else if(e.key === "ArrowDown"){
      e.preventDefault();
      if(hIdx < history.length - 1){ hIdx++; input.value = history[hIdx]; }
      else { hIdx = history.length; input.value = ""; }
    } else if(e.key === "Tab"){
      e.preventDefault();
      const partial = input.value.toLowerCase();
      const all = Object.keys(commands);
      const match = all.find(c => c.startsWith(partial));
      if(match) input.value = match;
    }
  });
}

  const d = new Date();
  el.textContent = d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}) + " IST";
}
